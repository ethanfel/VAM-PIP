[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vampip"
version = "0.16.3"
description = "Safe Virt-A-Mate package management, profiles, leases, and browser UI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "VAM-PIP contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/ethanfel/VAM-PIP"
Repository = "https://github.com/ethanfel/VAM-PIP"
Issues = "https://github.com/ethanfel/VAM-PIP/issues"

[project.scripts]
vampip = "vampip.cli:main"
vampip-manager = "vampip.manager_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vampip = [
    "bridge_assets/*.cs",
    "bridge_assets/*.cslist",
    "bridge_assets/*.md",
    "bridge_assets/*.vap",
    "renderer_assets/**/*",
    "webui/*.html",
    "webui/*.css",
    "webui/*.js",
]

[tool.setuptools.data-files]
"share/vampip/docs" = ["docs/SAM3D_SETUP.md"]
"share/vampip/scripts" = ["scripts/create_sam3d_conda_env.sh"]
