[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vampip"
version = "0.12.2"
description = "Safe Virt-A-Mate package management, profiles, leases, and browser UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VAM-PIP contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/ethanfel/VAM-PIP"
Repository = "https://github.com/ethanfel/VAM-PIP"
Issues = "https://github.com/ethanfel/VAM-PIP/issues"

[project.scripts]
vampip = "vampip.cli:main"
vampip-manager = "vampip.manager_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vampip = [
    "bridge_assets/*.cs",
    "bridge_assets/*.cslist",
    "bridge_assets/*.md",
    "webui/*.html",
    "webui/*.css",
    "webui/*.js",
]
